[project]
name = "odoo-mcp"
version = "1.2.0"
description = "Serveur MCP pour piloter une base Odoo via XML-RPC : lecture, écriture gardée, import/export Excel, et journal d'audit avec rapport d'intervention. Aucun identifiant stocké."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Damien Dechamps" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "openpyxl>=3.1",
]
keywords = ["odoo", "mcp", "xmlrpc", "erp"]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odoo_mcp"]
